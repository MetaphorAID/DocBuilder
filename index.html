<!DOCTYPE html>
<html lang="hu">

<head>
  <meta charset="utf-8"/>
  <title>Document Builder</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <link rel="icon" type="image/x-icon" href="./favicon.ico">
  <link rel="stylesheet" href="main.css">
</head>

<body>
<header>
  <a href="#" class="btn ed-new locale">New</a>
  <a href="#" class="btn ed-open locale">Open</a>
  <a href="#" class="btn ed-recent disabled locale">Recent...</a>
  <a href="#" class="btn ed-save locale">Save As...</a>
  <a href="#" class="btn ed-undo disabled locale">Undo</a>
  <a href="#" class="btn ed-redo disabled locale">Redo</a>
  <a href="#" class="btn ed-exit locale">Exit</a>
  <div class="select btn ed-language" data-value="hu">
    <a href="#" data-value="hu" class="selected">HU</a>
    <a href="#" data-value="en">EN</a>
  </div>
</header>
<div id="header"></div>
<div id="editor"></div>
<div id="footer"></div>
<div id="message"></div>
<script src="hu.js"></script>
<script src="main.js"></script>
</body>

</html>
